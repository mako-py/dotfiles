# ==========================================
# MANGOWM 0.18.3
# ==========================================

# ── Appearance ─────────────────────────────

root_color=0x090609ff

border_px=2
border_radius=2

border_color=0x260b14ff
focus_color=0x8f1838ff
urgent_color=0xd93655ff

gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=12
gap_outer_vertical=12

smart_gaps=1
no_border_when_single=1

# ── Effects ────────────────────────────────

blur=0
shadows=0

focused_opacity=0.70
unfocused_opacity=0.60

# ── Animations ────────────────────────────

animations=1
layer_animations=1

animation_type_open=zoom
animation_type_close=fade

animation_fade_in=1
animation_fade_out=1

animation_duration_move=180
animation_duration_open=200
animation_duration_close=180
animation_duration_tag=200
animation_duration_focus=100

animation_curve_open=0.46,1.0,0.29,0.99
animation_curve_move=0.46,1.0,0.29,0.99
animation_curve_close=0.46,1.0,0.29,0.99
animation_curve_tag=0.46,1.0,0.29,0.99

# ── Layout ─────────────────────────────────

circle_layout=tile,scroller,grid

# ── Startup ─────────────────────────────────

exec_once=swaync

# ── Applications ────────────────────────────

bind=SUPER,Return,spawn,kitty
bind=SUPER,D,spawn,rofi -show drun
bind=SUPER,E,spawn,kitty -e yazi
bind=SUPER,B,spawn,firefox

# ── Window management ──────────────────────

bind=SUPER,Q,killclient
bind=SUPER,F,togglefullscreen

bind=SUPER,V,togglefloating
bind=SUPER,C,centerwin

bind=SUPER,M,minimized
bind=SUPER+SHIFT,M,restore_minimized

tag_rule=id:*,open_as_floating:1

# ── Focus ───────────────────────────────────

bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# ── Move tiled windows ─────────────────────

bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down

# ── Resize floating windows ────────────────

bind=SUPER+ALT,Left,smartresizewin,left
bind=SUPER+ALT,Right,smartresizewin,right
bind=SUPER+ALT,Up,smartresizewin,up
bind=SUPER+ALT,Down,smartresizewin,down

# ── Layout controls ─────────────────────────

bind=SUPER,Space,switch_layout
bind=SUPER+CTRL,Left,setmfact,-0.05
bind=SUPER+CTRL,Right,setmfact,+0.05

# ── Workspaces ──────────────────────────────

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

bind=SUPER,comma,viewtoleft
bind=SUPER,period,viewtoright

bind=SUPER+SHIFT,comma,tagtoleft
bind=SUPER+SHIFT,period,tagtoright

# ── Mouse ───────────────────────────────────

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ── Scrolling ───────────────────────────────

axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# ── Session ─────────────────────────────────

bind=SUPER+SHIFT,R,reload_config
bind=SUPER+SHIFT,Q,quit
